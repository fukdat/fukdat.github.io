services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billflow
      POSTGRES_PASSWORD: billflow
      POSTGRES_DB: billflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://billflow:billflow@db:5432/billflow
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

volumes:
  pgdata:
